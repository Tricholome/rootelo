{% extends "base.html" %}

{% block content %}
<div class="codex-section">	
    <h2>Welcome, frogs!</h2>

    <div class="date-controls" style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: 20px 0;">
        <button id="prevDateBtn" class="btn">&laquo; Jour précédent</button>
        <input type="date" id="datePicker" style="padding: 6px 12px; font-size: 1rem;">
        <button id="nextDateBtn" class="btn">Jour suivant &raquo;</button>
        <button id="latestDateBtn" class="btn">Dernier jour</button>
    </div>

    <table id="frogTable" class="display nowrap" style="width:100%">
        <thead>
            <tr>
                <th>Player</th>
                <th>Games</th>
                <th>Tribe</th>
            </tr>
        </thead>
        <tbody>
            {% for player in players %}
            <tr>
                <td>{{ player.name }}</td>
                <td>{{ player.games }}</td>
                <td>{{ player.tribe }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

{% block custom_js %}
<script>
    const matchesData = {{ matches_json | safe }};
    const availableDates = {{ dates_json | safe }};
    const tribesData = {{ tribes_json | safe }};

    $(document).ready(function () {
        if (!availableDates || availableDates.length === 0) return;

        const table = $('#frogTable').DataTable({
            "order": [[1, "desc"]],
            "responsive": true,
            "pageLength": 25,
            "dom": 'rt<"bottom"p><"clear">'
        });

        const $datePicker = $('#datePicker');
        const $prevBtn = $('#prevDateBtn');
        const $nextBtn = $('#nextDateBtn');
        const $latestBtn = $('#latestDateBtn');

        $datePicker.attr('min', availableDates[0]);
        $datePicker.attr('max', availableDates[availableDates.length - 1]);

        let currentIndex = availableDates.length - 1;

        function updateTableForDate(selectedDate) {
            $datePicker.val(selectedDate);

            // Recalcul du nombre de parties jusqu'à la date
            const playerGames = {};
            matchesData.forEach(match => {
                if (match.date <= selectedDate) {
                    match.players.forEach(player => {
                        playerGames[player] = (playerGames[player] || 0) + 1;
                    });
                }
            });

            // Récupération de la tribu calculée par Louvain pour cette date
            const dateTribes = tribesData[selectedDate] || {};

            const newRows = Object.entries(playerGames).map(([name, games]) => [
                name,
                games,
                dateTribes[name] || 'Inclassé'
            ]);

            table.clear();
            table.rows.add(newRows);
            table.draw();

            $prevBtn.prop('disabled', currentIndex <= 0);
            $nextBtn.prop('disabled', currentIndex >= availableDates.length - 1);
        }

        function setDateByIndex(index) {
            if (index >= 0 && index < availableDates.length) {
                currentIndex = index;
                updateTableForDate(availableDates[currentIndex]);
            }
        }

        $prevBtn.on('click', () => setDateByIndex(currentIndex - 1));
        $nextBtn.on('click', () => setDateByIndex(currentIndex + 1));
        $latestBtn.on('click', () => setDateByIndex(availableDates.length - 1));

        $datePicker.on('change', function () {
            const val = $(this).val();
            let matchIdx = availableDates.findIndex(d => d >= val);
            if (matchIdx !== -1) {
                currentIndex = matchIdx;
            } else {
                currentIndex = availableDates.length - 1;
            }
            updateTableForDate(availableDates[currentIndex]);
        });

        setDateByIndex(currentIndex);
    });
</script>
{% endblock %}
