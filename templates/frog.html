{% extends "base.html" %}

{% block subnav %}
<!-- Carte interactive des clairières -->
<div id="tribeMapContainer" style="width: 100%; height: 380px; margin: 10px 0 25px 0; position: relative; overflow: hidden;">
    <svg id="tribeMapSvg" style="width: 100%; height: 100%; display: block;"></svg>
</div>
<!-- Date selector controls -->
    <div class="date-controls" style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: 20px 0;">
        <button id="earliestDateBtn" class="btn">Earliest Date</button>
		<button id="prevDateBtn" class="btn">&laquo; Prev. Day</button>
        <input type="date" id="datePicker" style="padding: 6px 12px; font-size: 1rem;">
        <button id="nextDateBtn" class="btn">Next Day &raquo;</button>
        <button id="latestDateBtn" class="btn">Latest Date</button>
    </div>
{% endblock %}

{% block content %}
<div style="max-width: clamp(600px, 60vw, 1600px); margin: 0 auto;">

    <table id="frogTable" class="display nowrap" style="width: 100%; table-layout: fixed;">
        <thead>
            <tr>
                <th style="width: 25%; text-align: left; overflow: hidden; text-overflow: ellipsis;">Player</th>
                <th style="width: 10%; text-align: center;">Games</th>
                <th style="text-align: center;"><img src="assets/items/tea.png" title="TEA" alt="TEA" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
                <th style="text-align: center;"><img src="assets/items/bag.png" title="BAG" alt="BAG" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
                <th style="text-align: center;"><img src="assets/items/sword.png" title="SWORD" alt="SWORD" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
                <th style="text-align: center;"><img src="assets/items/coins.png" title="COINS" alt="COINS" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
                <th style="text-align: center;"><img src="assets/items/hammer.png" title="HAMMER" alt="HAMMER" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
                <th style="text-align: center;"><img src="assets/items/crossbow.png" title="CROSSBOW" alt="CROSSBOW" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
                <th style="text-align: center;"><img src="assets/items/boot.png" title="BOOT" alt="BOOT" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
            </tr>
        </thead>
        <tbody>
            <!-- Table body populated dynamically by JS -->
        </tbody>
    </table>
</div>
{% endblock %}

{% block custom_js %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
    const snapshots = {{ snapshots_json | safe }};
    const availableDates = {{ dates_json | safe }};
    const TARGET_TRIBES = ["TEA", "BAG", "SWORD", "COINS", "HAMMER", "CROSSBOW", "BOOT"];

    let activeTribeFilter = null;
    let simulation = null;

    $(document).ready(function () {
        if (!availableDates || availableDates.length === 0) return;

        const table = $('#frogTable').DataTable({
            "order": [[1, "desc"]],
            "responsive": false,
            "autoWidth": false,
            "pageLength": 50,
            "dom": 'rt<"bottom"p><"clear">',
            "columnDefs": [
                { "className": "dt-nowrap", "targets": "_all" },
                { "className": "dt-center", "targets": [1, 2, 3, 4, 5, 6, 7, 8] }
            ]
        });

        const $datePicker =$('#datePicker');
		const $earliestBtn = $('#earliestDateBtn');
        const $prevBtn =$('#prevDateBtn');
        const $nextBtn =$('#nextDateBtn');
        const $latestBtn =$('#latestDateBtn');

        $datePicker.attr('min', availableDates[0]);$datePicker.attr('max', availableDates[availableDates.length - 1]);

        let currentIndex = availableDates.length - 1;

        function renderTribeCell(scoreData, isMainTribe) {
            if (!scoreData) {
                return `<div style="display:flex; justify-content:center;"><span style="color:#a0aec0;">-</span></div>`;
            }
            
            if (!isMainTribe && scoreData.pct < 10) {
                return `<div style="display:flex; justify-content:center;"><span style="color:#a0aec0;">-</span></div>`;
            }
            
            const pctStr = `<span style="font-weight:600; font-size:0.82rem;">${scoreData.pct}%</span>`;
            
            if (!isMainTribe || !scoreData.status) {
                return `<div style="display:inline-flex; align-items:center; justify-content:center; gap:4px; width:100%;">${pctStr}</div>`;
            }

            let bgColor = "#4a5568"; 

            if (scoreData.status === "Partisan") {
                bgColor = "#918F08";
            } else if (scoreData.status === "Squire") {
                bgColor = "#256D75";
            } else if (scoreData.status === "Friend") {
                bgColor = "#B8681A";
            } else if (scoreData.status === "Favoring") {
                bgColor = "#A0402B";
            }

            const badge = `<span style="background:${bgColor}; color:#fff; padding:1px 5px; border-radius:4px; font-size:0.68rem; font-weight:600; white-space:nowrap;">${scoreData.status}</span>`;

            return `<div style="display:inline-flex; align-items:center; justify-content:center; gap:4px; width:100%;">${pctStr} ${badge}</div>`;
        }

        function renderTribeGraph(snapshot) {
            const svg = d3.select("#tribeMapSvg");
            const container = document.getElementById('tribeMapContainer');
            const width = container.clientWidth || 800;
            const height = 380;
            const duration = 500;

            if (svg.select("g.links-layer").empty()) {
                svg.append("g").attr("class", "links-layer");
                svg.append("g").attr("class", "nodes-layer");
            }

            const activeTribes = snapshot.active_tribes || [];

            const newNodes = activeTribes.map(t => {
                const count = snapshot.summary[t] || 0;
                return {
                    id: t,
                    label: (snapshot.tribe_labels && snapshot.tribe_labels[t]) ? snapshot.tribe_labels[t] : t,
                    count: count,
                    radius: Math.max(28, 20 + Math.sqrt(count) * 10)
                };
            });

            const prevNodesMap = new Map(simulation ? simulation.nodes().map(d => [d.id, d]) : []);
            newNodes.forEach(d => {
                if (prevNodesMap.has(d.id)) {
                    const prev = prevNodesMap.get(d.id);
                    d.x = prev.x;
                    d.y = prev.y;
                    d.vx = prev.vx;
                    d.vy = prev.vy;
                }
            });

            const newLinks = [];
            for (let i = 0; i < activeTribes.length; i++) {
                for (let j = i + 1; j < activeTribes.length; j++) {
                    const t1 = activeTribes[i];
                    const t2 = activeTribes[j];
                    let totalAffinity = 0;
                    let count = 0;

                    snapshot.players.forEach(p => {
                        if (p.main_tribe === t1 && p.scores[t2]) {
                            totalAffinity += p.scores[t2].pct;
                            count++;
                        } else if (p.main_tribe === t2 && p.scores[t1]) {
                            totalAffinity += p.scores[t1].pct;
                            count++;
                        }
                    });

                    const avg = count > 0 ? (totalAffinity / count) : 0;
                    if (avg > 2) {
                        newLinks.push({ source: t1, target: t2, value: avg });
                    }
                }
            }

            // 1. LIENS ENTRE LES CLAIRIÈRES
            const linkSel = svg.select("g.links-layer")
                .selectAll("line")
                .data(newLinks, d => `${d.source.id || d.source}-${d.target.id || d.target}`);

            linkSel.exit()
                .transition().duration(duration)
                .attr("stroke-opacity", 0)
                .remove();

            const linkEnter = linkSel.enter().append("line")
                .attr("stroke", "rgba(255, 255, 255, 0.25)")
                .attr("stroke-opacity", 0)
                .attr("stroke-dasharray", "4, 4")
                .attr("stroke-width", d => Math.max(1, d.value / 5));

            const link = linkEnter.merge(linkSel);
            link.transition().duration(duration)
                .attr("stroke", "rgba(255, 255, 255, 0.25)")
                .attr("stroke-opacity", 0.4)
                .attr("stroke-width", d => Math.max(1, d.value / 5));

            // 2. NOEUDS (CLAIRIÈRES)
            const nodeSel = svg.select("g.nodes-layer")
                .selectAll("g.node-group")
                .data(newNodes, d => d.id);

            nodeSel.exit()
                .transition().duration(duration)
                .style("opacity", 0)
                .remove();

            const nodeEnter = nodeSel.enter().append("g")
                .attr("class", "node-group")
                .style("cursor", "pointer")
                .style("opacity", 0)
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended));

            nodeEnter.append("circle")
                .attr("class", "node-circle")
                .attr("r", 0);

            nodeEnter.append("image")
                .attr("class", "node-icon")
                .attr("pointer-events", "none");

            const textGroup = nodeEnter.append("text")
                .attr("class", "count-text")
                .attr("text-anchor", "middle")
                .attr("pointer-events", "none");

            textGroup.append("tspan").attr("class", "num-span");
            textGroup.append("tspan").attr("class", "lbl-span");

            const node = nodeEnter.merge(nodeSel);

            node.transition().duration(duration)
                .style("opacity", 1);

            node.select(".node-circle")
                .transition().duration(duration)
                .attr("r", d => d.radius)
                .style("fill", d => activeTribeFilter === d.id ? "rgba(18, 38, 25, 0.9)" : "rgba(10, 22, 14, 0.65)")
                .style("stroke", d => activeTribeFilter === d.id ? "var(--main-color)" : "rgba(255, 255, 255, 0.22)")
                .style("stroke-width", d => activeTribeFilter === d.id ? "3px" : "1.5px");

            node.select(".node-icon")
                .attr("href", d => `assets/items/${d.id.toLowerCase()}.png`)
                .attr("xlink:href", d => `assets/items/${d.id.toLowerCase()}.png`)
                .attr("width", d => Math.max(26, d.radius * 0.75))
                .attr("height", d => Math.max(26, d.radius * 0.75))
                .attr("x", d => -Math.max(26, d.radius * 0.75) / 2)
                .attr("y", d => -Math.max(26, d.radius * 0.75) / 2 - 8);

            node.select(".count-text")
                .attr("transform", d => `translate(0, ${Math.max(26, d.radius * 0.75) / 2 + 8})`);

            node.select(".num-span")
                .text(d => d.count)
                .attr("x", 0)
                .attr("dy", "0")
                .style("font-size", "1.05rem")
                .style("font-weight", "800")
                .style("fill", "#ffffff");

            node.select(".lbl-span")
                .text(" members")
                .attr("x", 0)
                .attr("dy", "1.15em")
                .style("font-size", "0.62rem")
                .style("font-weight", "600")
                .style("letter-spacing", "0.06em")
                .style("fill", "rgba(255, 255, 255, 0.65)");

            node.on("click", (event, d) => {
                activeTribeFilter = (activeTribeFilter === d.id) ? null : d.id;
                updateTableForDate($datePicker.val());
            });

            // 3. FORCE DE CENTRAGE
            if (!simulation) {
                simulation = d3.forceSimulation()
                    .force("link", d3.forceLink().id(d => d.id).distance(145))
                    .force("charge", d3.forceManyBody().strength(-320))
                    .force("x", d3.forceX(width / 2).strength(0.08))
                    .force("y", d3.forceY(height / 2).strength(0.08))
                    .force("center", d3.forceCenter(width / 2, height / 2))
                    .force("collision", d3.forceCollide().radius(d => d.radius + 15));
            } else {
                simulation.force("center", d3.forceCenter(width / 2, height / 2));
                simulation.force("x", d3.forceX(width / 2).strength(0.08));
                simulation.force("y", d3.forceY(height / 2).strength(0.08));
            }

            simulation.nodes(newNodes);
            simulation.force("link").links(newLinks);
            simulation.alpha(0.3).restart();

            simulation.on("tick", () => {
                newNodes.forEach(d => {
                    const margin = d.radius + 8;
                    d.x = Math.max(margin, Math.min(width - margin, d.x));
                    d.y = Math.max(margin, Math.min(height - margin, d.y));
                });

                link
                    .attr("x1", d => {
                        const dx = d.target.x - d.source.x;
                        const dy = d.target.y - d.source.y;
                        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                        return d.source.x + (dx / dist) * d.source.radius;
                    })
                    .attr("y1", d => {
                        const dx = d.target.x - d.source.x;
                        const dy = d.target.y - d.source.y;
                        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                        return d.source.y + (dy / dist) * d.source.radius;
                    })
                    .attr("x2", d => {
                        const dx = d.target.x - d.source.x;
                        const dy = d.target.y - d.source.y;
                        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                        return d.target.x - (dx / dist) * d.target.radius;
                    })
                    .attr("y2", d => {
                        const dx = d.target.x - d.source.x;
                        const dy = d.target.y - d.source.y;
                        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                        return d.target.y - (dy / dist) * d.target.radius;
                    });

                node.attr("transform", d => `translate(${d.x},${d.y})`);
            });

            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
        }

        function updateTableForDate(selectedDate) {
            $datePicker.val(selectedDate);
            const snapshot = snapshots[selectedDate];
            if (!snapshot) return;

            const activeTribes = snapshot.active_tribes || [];

            // 1. Rendu du graphe D3.js
            renderTribeGraph(snapshot);

            // 2. Visibilité dynamique et en-tête avec icône d'objet centrée
            TARGET_TRIBES.forEach((tribe, idx) => {
                const colIdx = idx + 2; 
                const isActive = activeTribes.includes(tribe);
                
                table.column(colIdx).visible(isActive, false);

                if (isActive) {
                    const displayLabel = (snapshot.tribe_labels && snapshot.tribe_labels[tribe]) ? snapshot.tribe_labels[tribe] : tribe;
                    const iconPath = `assets/items/${tribe.toLowerCase()}.png`;
                    $(table.column(colIdx).header()).html(`<img src="${iconPath}" title="${displayLabel}" alt="${displayLabel}" style="height:26px; width:26px; vertical-align:middle; object-fit:contain; display:inline-block;">`);
                }
            });

            // 3. Filtrage des joueurs
            let playersToDisplay = snapshot.players;
            if (activeTribeFilter) {
                playersToDisplay = playersToDisplay.filter(p => p.main_tribe === activeTribeFilter);
            }

            // 4. Construction des lignes du tableau
            const newRows = playersToDisplay.map(p => {
                return [
                    p.name,
                    p.games,
                    ...TARGET_TRIBES.map(t => renderTribeCell(p.scores[t], p.main_tribe === t))
                ];
            });

            table.clear();
            table.rows.add(newRows);
            table.columns.adjust();
            table.draw();

            $prevBtn.prop('disabled', currentIndex <= 0);$nextBtn.prop('disabled', currentIndex >= availableDates.length - 1);
        }

        function setDateByIndex(index) {
            if (index >= 0 && index < availableDates.length) {
                currentIndex = index;
                updateTableForDate(availableDates[currentIndex]);
            }
        }

        $prevBtn.on('click', () => setDateByIndex(currentIndex - 1));
        $nextBtn.on('click', () => setDateByIndex(currentIndex + 1));
		$latestBtn.on('click', () => setDateByIndex(availableDates.length - 1));
		$earliestBtn.on('click', () => setDateByIndex(0));

        $datePicker.on('change', function () {
            const val = $(this).val();
            let matchIdx = availableDates.findIndex(d => d >= val);
            currentIndex = matchIdx !== -1 ? matchIdx : availableDates.length - 1;
            updateTableForDate(availableDates[currentIndex]);
        });

        $(window).on('resize', function() {
            if (availableDates[currentIndex]) {
                updateTableForDate(availableDates[currentIndex]);
            }
        });

        setDateByIndex(currentIndex);
    });
</script>
{% endblock %}
