{% extends "base.html" %}

{% block subnav %}
<!-- Carte interactive des clairières -->
<div id="tribeMapContainer" style="width: 100%; height: 380px; margin: 10px 0 25px 0; position: relative; overflow: hidden;">
    <svg id="tribeMapSvg" style="width: 100%; height: 100%; display: block;"></svg>
</div>
<!-- Date selector controls -->
    <div class="date-controls" style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: 20px 0;">
        <button id="earliestDateBtn" class="btn">Earliest Date</button>
        <button id="prevDateBtn" class="btn">&laquo; Prev. Day</button>
        <input type="date" id="datePicker" style="padding: 6px 12px; font-size: 1rem;">
        <button id="nextDateBtn" class="btn">Next Day &raquo;</button>
        <button id="latestDateBtn" class="btn">Latest Date</button>
    </div>
{% endblock %}

{% block content %}
<div style="max-width: clamp(600px, 60vw, 1600px); margin: 0 auto;">

    <table id="frogTable" class="display nowrap" style="width: 100%; table-layout: fixed;">
        <thead>
            <tr>
                <th style="width: 25%; text-align: left; overflow: hidden; text-overflow: ellipsis;">Player</th>
                <th style="width: 10%; text-align: center;">Games</th>
                <th style="text-align: center;"><img src="assets/items/tea.png" title="TEA" alt="TEA" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
                <th style="text-align: center;"><img src="assets/items/bag.png" title="BAG" alt="BAG" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
                <th style="text-align: center;"><img src="assets/items/sword.png" title="SWORD" alt="SWORD" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
                <th style="text-align: center;"><img src="assets/items/coins.png" title="COINS" alt="COINS" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
                <th style="text-align: center;"><img src="assets/items/hammer.png" title="HAMMER" alt="HAMMER" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
                <th style="text-align: center;"><img src="assets/items/crossbow.png" title="CROSSBOW" alt="CROSSBOW" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
                <th style="text-align: center;"><img src="assets/items/boot.png" title="BOOT" alt="BOOT" style="height:26px; width:26px; vertical-align:middle; object-fit:contain;"></th>
            </tr>
        </thead>
        <tbody>
            <!-- Table body populated dynamically by JS -->
        </tbody>
    </table>
</div>
{% endblock %}

{% block custom_js %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
    const snapshots = {{ snapshots_json | safe }};
    const availableDates = {{ dates_json | safe }};
    const TARGET_TRIBES = ["TEA", "BAG", "SWORD", "COINS", "HAMMER", "CROSSBOW", "BOOT"];

    let activeTribeFilter = null;
    let simulation = null;

    $(document).ready(function () {
        if (!availableDates || availableDates.length === 0) return;

        const table = $('#frogTable').DataTable({
            "order": [[1, "desc"]],
            "responsive": false,
            "autoWidth": false,
            "pageLength": 50,
            "dom": 'rt<"bottom"p><"clear">',
            "columnDefs": [
                { "className": "dt-nowrap", "targets": "_all" },
                { "className": "dt-center", "targets": [1, 2, 3, 4, 5, 6, 7, 8] }
            ]
        });

        const $datePicker =$('#datePicker');
        const $earliestBtn =$('#earliestDateBtn');
        const $prevBtn =$('#prevDateBtn');
        const $nextBtn =$('#nextDateBtn');
        const $latestBtn =$('#latestDateBtn');

        $datePicker.attr('min', availableDates[0]);$datePicker.attr('max', availableDates[availableDates.length - 1]);

        let currentIndex = availableDates.length - 1;

        function renderTribeCell(scoreData, isMainTribe) {
            if (!scoreData) {
                return `<div style="display:flex; justify-content:center;"><span style="color:#a0aec0;">-</span></div>`;
            }
            
            if (!isMainTribe && scoreData.pct < 10) {
                return `<div style="display:flex; justify-content:center;"><span style="color:#a0aec0;">-</span></div>`;
            }
            
            const pctStr = `<span style="font-weight:600; font-size:0.82rem;">${scoreData.pct}%</span>`;
            
            if (!isMainTribe || !scoreData.status) {
                return `<div style="display:inline-flex; align-items:center; justify-content:center; gap:4px; width:100%;">${pctStr}</div>`;
            }

            let bgColor = "#4a5568"; 

            if (scoreData.status === "Partisan") {
                bgColor = "#918F08";
            } else if (scoreData.status === "Squire") {
                bgColor = "#256D75";
            } else if (scoreData.status === "Friend") {
                bgColor = "#B8681A";
            } else if (scoreData.status === "Favoring") {
                bgColor = "#A0402B";
            }

            const badge = `<span style="background:${bgColor}; color:#fff; padding:1px 5px; border-radius:4px; font-size:0.68rem; font-weight:600; white-space:nowrap;">${scoreData.status}</span>`;

            return `<div style="display:inline-flex; align-items:center; justify-content:center; gap:4px; width:100%;">${pctStr} ${badge}</div>`;
        }

        function getStatusBadgeColor(status) {
            switch (status) {
                case "Partisan": return "#2e7d32"; // Vert
                case "Squire":   return "#1565c0"; // Bleu
                case "Friend":   return "#d97706"; // Orange
                case "Favoring": return "#c62828"; // Rouge
                default:         return "#4a5568"; // Gris par défaut
            }
        }

        function renderTribeGraph(snapshot) {
            const svg = d3.select("#tribeMapSvg");
            const container = document.getElementById('tribeMapContainer');
            const width = container.clientWidth || 900;
            const height = 450;
            const duration = 500;

            if (svg.select("g.links-layer").empty()) {
                svg.append("g").attr("class", "links-layer");
                svg.append("g").attr("class", "satellites-layer");
                svg.append("g").attr("class", "tribes-layer");
            }

            const activeTribes = snapshot.active_tribes || [];
            const tribeLayout = snapshot.tribe_layout || {};
            const playersMap = new Map((snapshot.players || []).map(p => [p.name, p]));

            // -------------------------------------------------------------------------
            // 1. CONSTRUCTION DES NŒUDS ET LIENS (Graph Data)
            // -------------------------------------------------------------------------
            const nodes = [];
            const links = [];

            // A. Nœuds des Clairières (Tribus)
            activeTribes.forEach(t => {
                const layout = tribeLayout[t] || { pillars: [], satellites: [] };
                const pillars = layout.pillars || [];
                const count = (snapshot.summary && snapshot.summary[t]) ? snapshot.summary[t] : 0;
                
                const radius = Math.max(50, 32 + Math.sqrt(pillars.length) * 18);

                nodes.push({
                    id: `tribe_${t}`,
                    nodeType: 'tribe',
                    tribeId: t,
                    label: (snapshot.tribe_labels && snapshot.tribe_labels[t]) ? snapshot.tribe_labels[t] : t,
                    count: count,
                    pillars: pillars,
                    radius: radius
                });
            });

            // B. Nœuds Satellites (Joueurs) : Uniquement si une clairière est active
            if (activeTribeFilter && activeTribes.includes(activeTribeFilter)) {
                const t = activeTribeFilter;
                const layout = tribeLayout[t] || { pillars: [], satellites: [] };
                const satellites = layout.satellites || [];

                satellites.forEach(pName => {
                    const pData = playersMap.get(pName);
                    const scoreObj = (pData && pData.scores) ? pData.scores[t] : null;
                    const pct = scoreObj ? scoreObj.pct : 0;
                    const status = scoreObj ? scoreObj.status : null;

                    const satNodeId = `sat_${t}_${pName}`;
                    nodes.push({
                        id: satNodeId,
                        nodeType: 'satellite',
                        playerName: pName,
                        tribeId: t,
                        pct: pct,
                        status: status,
                        color: getStatusBadgeColor(status),
                        radius: 14
                    });

                    links.push({
                        source: satNodeId,
                        target: `tribe_${t}`,
                        linkType: 'orbit',
                        distance: (nodes.find(n => n.id === `tribe_${t}`)?.radius || 50) + 35
                    });
                });
            }

            // C. Sentiers Inter-Tribus (Liens entre clairières)
            for (let i = 0; i < activeTribes.length; i++) {
                for (let j = i + 1; j < activeTribes.length; j++) {
                    const t1 = activeTribes[i];
                    const t2 = activeTribes[j];
                    let totalAffinity = 0;
                    let count = 0;

                    (snapshot.players || []).forEach(p => {
                        if (p.main_tribe === t1 && p.scores[t2]) {
                            totalAffinity += p.scores[t2].pct;
                            count++;
                        } else if (p.main_tribe === t2 && p.scores[t1]) {
                            totalAffinity += p.scores[t1].pct;
                            count++;
                        }
                    });

                    const avg = count > 0 ? (totalAffinity / count) : 0;
                    if (avg > 2) {
                        links.push({
                            source: `tribe_${t1}`,
                            target: `tribe_${t2}`,
                            linkType: 'path',
                            value: avg,
                            distance: 220
                        });
                    }
                }
            }

            const prevMap = new Map(simulation ? simulation.nodes().map(d => [d.id, d]) : []);
            nodes.forEach(d => {
                if (prevMap.has(d.id)) {
                    const prev = prevMap.get(d.id);
                    d.x = prev.x; d.y = prev.y;
                    d.vx = prev.vx; d.vy = prev.vy;
                }
            });

            // -------------------------------------------------------------------------
            // 2. RENDU DES SENTIERS & LIENS D'ORBITE
            // -------------------------------------------------------------------------
            const linkSel = svg.select("g.links-layer")
                .selectAll("line")
                .data(links.filter(l => l.linkType === 'path'), d => `${d.source.id || d.source}-${d.target.id || d.target}`);

            linkSel.exit().transition().duration(duration).attr("stroke-opacity", 0).remove();

            const linkEnter = linkSel.enter().append("line")
                .attr("stroke", "rgba(255, 255, 255, 0.25)")
                .attr("stroke-dasharray", "3, 4")
                .attr("stroke-width", d => Math.max(1, d.value / 5));

            const pathLink = linkEnter.merge(linkSel);
            pathLink.transition().duration(duration)
                .attr("stroke-width", d => Math.max(1, d.value / 5));

            // -------------------------------------------------------------------------
            // 3. RENDU DES CLAIRIÈRES (Tribus + Piliers)
            // -------------------------------------------------------------------------
            const tribeNodes = nodes.filter(n => n.nodeType === 'tribe');
            const tribeSel = svg.select("g.tribes-layer")
                .selectAll("g.tribe-group")
                .data(tribeNodes, d => d.id);

            tribeSel.exit().transition().duration(duration).style("opacity", 0).remove();

            const tribeEnter = tribeSel.enter().append("g")
                .attr("class", "tribe-group")
                .style("cursor", "pointer")
                .call(d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended));

            tribeEnter.append("circle")
                .attr("class", "clearing-circle")
                .attr("fill", "rgba(20, 26, 38, 0.45)")
                .attr("stroke", "rgba(255, 255, 255, 0.55)")
                .attr("stroke-width", 1.5)
                .attr("stroke-dasharray", "4, 4");

            tribeEnter.append("image")
                .attr("class", "tribe-icon")
                .attr("pointer-events", "none");

            tribeEnter.append("text")
                .attr("class", "tribe-title")
                .attr("text-anchor", "middle")
                .attr("fill", "#ffffff")
                .style("font-size", "0.75rem")
                .style("font-weight", "bold")
                .style("pointer-events", "none");

            tribeEnter.append("g").attr("class", "pillars-container");

            const tribeGroup = tribeEnter.merge(tribeSel);

            tribeGroup.select(".clearing-circle")
                .transition().duration(duration)
                .attr("r", d => d.radius)
                .attr("stroke", d => activeTribeFilter === d.tribeId ? "#68d391" : "rgba(255, 255, 255, 0.55)")
                .attr("stroke-width", d => activeTribeFilter === d.tribeId ? 3 : 1.5)
                .attr("stroke-dasharray", d => activeTribeFilter === d.tribeId ? "none" : "4, 4");

            tribeGroup.select(".tribe-icon")
                .attr("href", d => `assets/items/${d.tribeId.toLowerCase()}.png`)
                .attr("xlink:href", d => `assets/items/${d.tribeId.toLowerCase()}.png`)
                .attr("width", 22)
                .attr("height", 22)
                .attr("x", -11)
                .attr("y", d => -d.radius + 8);

            tribeGroup.select(".tribe-title")
                .text(d => `${d.label} (${d.count})`)
                .attr("y", d => -d.radius + 38);

            tribeGroup.each(function(d) {
                const container = d3.select(this).select(".pillars-container");
                const pillars = d.pillars || [];
                const startY = -d.radius + 52;
                const lineGap = 13;

                const pSel = container.selectAll("text.pillar-name").data(pillars, p => p);
                pSel.exit().remove();

                pSel.enter().append("text")
                    .attr("class", "pillar-name")
                    .attr("text-anchor", "middle")
                    .attr("fill", "#68d391")
                    .style("font-size", "0.68rem")
                    .style("font-weight", "600")
                    .style("pointer-events", "none")
                    .merge(pSel)
                    .text(p => `★ ${p}`)
                    .attr("y", (p, idx) => startY + (idx * lineGap));
            });

            tribeGroup.on("click", (event, d) => {
                activeTribeFilter = (activeTribeFilter === d.tribeId) ? null : d.tribeId;
                updateTableForDate($datePicker.val());
            });

            // -------------------------------------------------------------------------
            // 4. RENDU DES SATELLITES (Joueurs uniquement sur sélection)
            // -------------------------------------------------------------------------
            const satNodes = nodes.filter(n => n.nodeType === 'satellite');
            const satSel = svg.select("g.satellites-layer")
                .selectAll("g.sat-group")
                .data(satNodes, d => d.id);

            satSel.exit().transition().duration(duration).style("opacity", 0).remove();

            const satEnter = satSel.enter().append("g")
                .attr("class", "sat-group")
                .style("cursor", "pointer")
                .call(d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended));

            satEnter.append("rect")
                .attr("class", "sat-badge")
                .attr("rx", 8)
                .attr("ry", 8)
                .attr("height", 18);

            satEnter.append("text")
                .attr("class", "sat-label")
                .attr("text-anchor", "middle")
                .attr("fill", "#ffffff")
                .attr("dy", 12)
                .style("font-size", "0.62rem")
                .style("font-weight", "600");

            const satGroup = satEnter.merge(satSel);

            satGroup.select(".sat-badge")
                .attr("fill", d => d.color)
                .attr("stroke", "rgba(255,255,255,0.4)")
                .attr("stroke-width", 1);

            satGroup.select(".sat-label")
                .text(d => `${d.playerName} · ${d.status ? d.status : ''} ${d.pct}%`)
                .each(function() {
                    const bbox = this.getBBox();
                    const width = bbox.width + 12;
                    d3.select(this.parentNode).select(".sat-badge")
                        .attr("width", width)
                        .attr("x", -width / 2)
                        .attr("y", -1);
                });

            // -------------------------------------------------------------------------
            // 5. MOTEUR PHYSIQUE (D3 Force Simulation)
            // -------------------------------------------------------------------------
            if (!simulation) {
                simulation = d3.forceSimulation()
                    .force("link", d3.forceLink().id(d => d.id).distance(d => d.distance || 180))
                    .force("charge", d3.forceManyBody().strength(d => d.nodeType === 'tribe' ? -450 : -60))
                    .force("center", d3.forceCenter(width / 2, height / 2))
                    .force("collide", d3.forceCollide().radius(d => d.radius + (d.nodeType === 'satellite' ? 18 : 25)));
            }

            simulation.nodes(nodes);
            simulation.force("link").links(links);
            simulation.alpha(0.35).restart();

            simulation.on("tick", () => {
                pathLink
                    .attr("x1", d => getCircleIntersection(d.source, d.target).x1)
                    .attr("y1", d => getCircleIntersection(d.source, d.target).y1)
                    .attr("x2", d => getCircleIntersection(d.source, d.target).x2)
                    .attr("y2", d => getCircleIntersection(d.source, d.target).y2);

                tribeGroup.attr("transform", d => `translate(${d.x},${d.y})`);
                satGroup.attr("transform", d => `translate(${d.x},${d.y})`);
            });

            function getCircleIntersection(source, target) {
                const dx = target.x - source.x;
                const dy = target.y - source.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                const r1 = source.radius || 0;
                const r2 = target.radius || 0;
                return {
                    x1: source.x + (dx / dist) * r1,
                    y1: source.y + (dy / dist) * r1,
                    x2: target.x - (dx / dist) * r2,
                    y2: target.y - (dy / dist) * r2
                };
            }

            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x; d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x; d.fy = event.y;
            }

            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null; d.fy = null;
            }
        }

        function updateTableForDate(dateStr) {
            const snapshot = snapshots[dateStr];
            if (!snapshot) return;

            $datePicker.val(dateStr);
            renderTribeGraph(snapshot);

            let playersToDisplay = snapshot.players || [];
            if (activeTribeFilter) {
                playersToDisplay = playersToDisplay.filter(p => p.main_tribe === activeTribeFilter);
            }

            const newRows = playersToDisplay.map(p => {
                return [
                    p.name,
                    p.games,
                    ...TARGET_TRIBES.map(t => renderTribeCell(p.scores ? p.scores[t] : null, p.main_tribe === t))
                ];
            });

            table.clear();
            table.rows.add(newRows);
            table.columns.adjust();
            table.draw();

            $prevBtn.prop('disabled', currentIndex <= 0);$nextBtn.prop('disabled', currentIndex >= availableDates.length - 1);
        }

        function setDateByIndex(index) {
            if (index >= 0 && index < availableDates.length) {
                currentIndex = index;
                updateTableForDate(availableDates[currentIndex]);
            }
        }

        $prevBtn.on('click', () => setDateByIndex(currentIndex - 1));$nextBtn.on('click', () => setDateByIndex(currentIndex + 1));
        $latestBtn.on('click', () => setDateByIndex(availableDates.length - 1));$earliestBtn.on('click', () => setDateByIndex(0));

        $datePicker.on('change', function () {
            const val = $(this).val();
            let matchIdx = availableDates.findIndex(d => d >= val);
            currentIndex = matchIdx !== -1 ? matchIdx : availableDates.length - 1;
            updateTableForDate(availableDates[currentIndex]);
        });

        $(window).on('resize', function() {
            if (availableDates[currentIndex]) {
                updateTableForDate(availableDates[currentIndex]);
            }
        });

        setDateByIndex(currentIndex);
    });
</script>
{% endblock %}
