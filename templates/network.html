{% extends "base.html" %}

{% block content %}
<!-- En-tête minimaliste ou introduction si besoin -->
<div class="page-intro" style="text-align: center; margin-bottom: 20px;">
    <h2>Homelands</h2>
    <p>Mapping the shifting allegiances and evolving hubs of the woodland.</p>
</div>

<!-- Carte interactive des Homelands -->
<div id="tribeMapContainer" class="tribe-map-container" style="width: 100%; height: 450px; background: #1a202c; border-radius: 12px; position: relative; overflow: hidden; border: 1px solid #2d3748; margin-bottom: 20px;">
    <svg id="tribeMapSvg" class="tribe-map-svg" style="width: 100%; height: 100%;"></svg>
</div>

<!-- Contrôles temporels (Frise / Sélecteur de date) -->
<div class="date-controls" style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 15px;">
    <button id="earliestDateBtn" class="btn">Début</button>
    <button id="prevDateBtn" class="btn">&laquo; Précédent</button>
    <input type="date" id="datePicker" class="date-picker" style="background: #2d3748; color: #fff; border: 1px solid #4a5568; padding: 6px 12px; border-radius: 6px;">
    <button id="nextDateBtn" class="btn">Suivant &raquo;</button>
    <button id="latestDateBtn" class="btn">Aujourd'hui</button>
</div>
{% endblock %}

{% block custom_js %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
    window.NETWORK_DATES = {{ dates_json | safe }};
    window.NETWORK_SNAPSHOTS = {{ snapshots_json | safe }};
    window.NETWORK_CONFIG = {{ config.network | tojson | safe }};
</script>
{% endblock %}
