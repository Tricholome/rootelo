{% extends "base.html" %}

{% block content %}
<div class="network-container">

    <!-- Date Selector Controls (HM & HN modes) -->
    <div id="dateControls" class="date-controls">
        <button id="earliestDateBtn" class="btn">Earliest Date</button>
        <button id="prevDateBtn" class="btn">&laquo; Previous Day</button>
        <input type="date" id="datePicker" class="date-picker">
        <button id="nextDateBtn" class="btn">Next Day &raquo;</button>
        <button id="latestDateBtn" class="btn">Latest Date</button>
    </div>

    <!-- Interactive Map Container -->
    <div id="tribeMapContainer" class="tribe-map-container">
        <div id="mapHeaderTitle" class="map-header-title" title="Click to reset to Homelands Map">
            Homelands Map &bull; <span class="header-subtitle">Click a region or search a player</span>
        </div>
        <div id="playerLedger" class="allegiance-ledger"></div>
        <svg id="tribeMapSvg" class="tribe-map-svg"></svg>
    </div>

</div>
{% endblock %}

{% block custom_js %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
    window.NETWORK_DATES = {{ dates_json | safe }};
    window.NETWORK_SNAPSHOTS = {{ snapshots_json | safe }};
    window.PLAYER_CONSTELLATIONS = {{ constellations_json | safe }};
    window.NETWORK_CONFIG = {{ config.network | tojson | safe }};
</script>
{% endblock %}
