{% extends "base.html" %}

{% block content %}
<div style="max-width: clamp(600px, 60vw, 1600px); margin: 0 auto;">

    <!-- Date Selector Controls -->
    <div id="dateControls" class="date-controls" style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: 15px 0;">
        <button id="earliestDateBtn" class="btn">Earliest Date</button>
        <button id="prevDateBtn" class="btn">&laquo; Previous Day</button>
        <input type="date" id="datePicker" style="padding: 6px 12px; font-size: 1rem;">
        <button id="nextDateBtn" class="btn">Next Day &raquo;</button>
        <button id="latestDateBtn" class="btn">Latest Date</button>
    </div>

    <!-- Interactive Map Container -->
    <div id="tribeMapContainer" style="width: 100%; height: 450px; background: rgba(0, 0, 0, 0.18); border-radius: 12px; margin: 10px 0 25px 0; position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08);">
        <div id="mapHeaderTitle" style="position: absolute; top: 12px; left: 16px; color: rgba(255, 255, 255, 0.45); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; pointer-events: none; z-index: 10;">
            Homelands Map &bull; <span style="font-weight: 400; text-transform: none; opacity: 0.85;">Click a region to filter members</span>
        </div>
        <svg id="tribeMapSvg" style="width: 100%; height: 100%; display: block;"></svg>
    </div>
	
	<div id="playerLedger" class="player-ledger-container" style="display: none;">
		<h4>Player Allegiance Ledger</h4>
		<div class="ledger-content"></div>
	</div>

</div>
{% endblock %}

{% block custom_js %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
    window.NETWORK_DATES = {{ dates_json | safe }};
    window.NETWORK_SNAPSHOTS = {{ snapshots_json | safe }};
    window.PLAYER_CONSTELLATIONS = {{ constellations_json | safe }};
    window.NETWORK_CONFIG = {{ config.network | tojson | safe }};
</script>
{% endblock %}
