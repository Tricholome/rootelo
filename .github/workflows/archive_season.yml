name: Archive Season Data

on:
  workflow_dispatch:
    inputs:
      league:
        description: 'League slug (e.g., rdl, hoot)'
        required: true
        default: 'rdl'
      season_tag:
        description: 'Season tag to archive (e.g., lh03)'
        required: true
      tournament_id:
        description: 'API Tournament ID'
        required: true
      cutoff_date:
        description: 'Cutoff date (YYYY-MM-DD)'
        required: true
      previous_season_tag:
        description: 'Previous season tag (leave empty if none)'
        required: false
      legacy:
        description: 'Enable legacy mode'
        type: boolean
        required: false
        default: false

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Archive Script
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ROOTDB_API_KEY: ${{ secrets.ROOTDB_API_KEY }}
        run: |
          CMD="python archive_season.py --league ${{ inputs.league }} --season ${{ inputs.season_tag }} --cutoff ${{ inputs.cutoff_date }} --tournament-id ${{ inputs.tournament_id }}"
          
          if [ -n "${{ inputs.previous_season_tag }}" ]; then
            CMD="$CMD --prev-season ${{ inputs.previous_season_tag }}"
          fi
          
          if [ "${{ inputs.legacy }}" = "true" ]; then
            CMD="$CMD --legacy"
          fi
          
          $CMD

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/
          
          git commit -m "Automated update of season archives (${{ inputs.league }} / ${{ inputs.season_tag }})" || echo "No changes to commit"
          git push
