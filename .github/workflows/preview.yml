name: 02. Deploy • HOOT Lab

on:
  push:
    branches:
      - hoot-lab
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build HOOT Lab Models
        env:
          PYTHONHASHSEED: "0"
          ROOTDB_TOKEN: ${{ secrets.ROOTDB_TOKEN }}
          SITE_BASE_URL: https://tricholome.github.io/hoot-lab
       run: |
          python src/main.py --all
          mkdir -p build_site
          cp *.html build_site/ 2>/dev/null || true
          for dir in hoot hoot-*; do
            [ -d "$dir" ] && cp -r "$dir" build_site/
          done
          cp -r static build_site/
          cp -r assets build_site/
          cp -r api build_site/

      - name: Deploy to HOOT Lab mirror
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEV_REPO_PAT }}
          external_repository: tricholome/hoot-lab
          publish_dir: ./build_site
          publish_branch: gh-pages
